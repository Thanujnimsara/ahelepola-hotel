<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book your stay – Heritage Ehelepola Hotel</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #fff;
      --tx: #2a2420;
      --mu: #7a6f66;
      --bd: #e3dcd2;
      --ac: #7a4a1e;
      --bad: #b33a3a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1815;
        --card: #26211d;
        --tx: #efe8df;
        --mu: #a69a8e;
        --bd: #3a332d;
        --ac: #d9a066;
        --bad: #e07070;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .w { max-width: 560px; margin: 0 auto; padding: 16px; }
    .hd { text-align: center; }
    .hd img { width: 80px; height: 80px; border-radius: 16px; }
    h1 { font: 600 22px Georgia, serif; color: var(--ac); margin: 8px 0 2px; }
    .hd p { margin: 0; color: var(--mu); font-size: 13px; }
    .c {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
    }
    label { display: block; font-size: 13px; color: var(--mu); margin-top: 10px; }
    input, select, textarea, button {
      font: inherit;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--bg);
      color: var(--tx);
    }
    .g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .t {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      cursor: pointer;
    }
    .t.on { border-color: var(--ac); outline: 2px solid var(--ac); }
    .t.off { opacity: .45; cursor: not-allowed; }
    button {
      background: var(--ac);
      color: var(--bg);
      border: 0;
      font-weight: 600;
      margin-top: 14px;
      cursor: pointer;
      border-radius: 8px;
    }
    #m { color: var(--bad); margin-top: 8px; font-size: 13px; }
    .hp { position: absolute; left: -9999px; }
    small { color: var(--mu); }
  </style>
</head>
<body>
  <div class="w">
    <div class="hd">
      <img src="../assets/images/logo.png" alt="Logo" onerror="this.src='https://ehelepolahotel.lk/assets/images/logo.png'">
      <h1 id="hn">Heritage Ehelepola Hotel</h1>
      <p><a href="https://www.google.com/maps/place/7%C2%B016'16.6%22N+80%C2%B040'59.6%22E/@7.2535157,80.6309725,13.65z/data=!4m4!3m3!8m2!3d7.2712634!4d80.6832217?hl=en&entry=ttu&g_ep=EgoyMDI2MTEwOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline; text-underline-offset: 2px;" title="Open in Google Maps"><i class="fas fa-map-marker-alt" style="color: #c8a97e; margin-right: 4px;"></i>No. 103, Pichchamalwaththa Handiya, Ehelepolawaththa, Gurudeniya, Kandy</a> · 0817008000</p>
    </div>

    <div id="v">
      <div class="c">
        <h2 style="margin:0;font-size:17px">Check availability</h2>
        <div class="g">
          <label>Check-in<input type="date" id="in"></label>
          <label>Check-out<input type="date" id="out"></label>
        </div>
        <div id="ty"></div>
        <div id="pn" style="margin-top:8px"></div>
        <small>Room rates are per night. A 10% service charge is added to the bill.</small>
      </div>

      <div class="c">
        <h2 style="margin:0;font-size:17px">Your details</h2>
        <label>Full name<input id="g" maxlength="120" placeholder="e.g. John Doe"></label>
        
        <label>ID Number (NIC / Passport)<input id="id_no" maxlength="30" placeholder="e.g. 199512345678 / N1234567"></label>

        <div class="g">
          <label>Phone / WhatsApp<input id="p" inputmode="tel" placeholder="+94 77 123 4567"></label>
          <label>Guests
            <select id="a">
              <option>1</option>
              <option selected>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
            </select>
          </label>
        </div>

        <label id="el">Email (optional)<input id="e" type="email" maxlength="120" placeholder="name@example.com"></label>
        <label>Note (optional)<textarea id="n" rows="2" maxlength="300" placeholder="Special requests, arrival time..."></textarea></label>
        <input class="hp" id="w" tabindex="-1" autocomplete="off">
        <button id="go">Send booking request</button>
        <div id="m"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = i => document.getElementById(i);
    const fm = n => 'Rs. ' + Math.round(n).toLocaleString('en-US');
    const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

    let types = {}, free = {}, sel = '', payOn = false, dep = 100;
    const td = iso(new Date());

    $('in').min = td;
    $('in').value = td;
    const nx = () => {
      const d = new Date($('in').value + 'T00:00');
      d.setDate(d.getDate() + 1);
      return iso(d);
    };
    $('out').value = nx();
    $('out').min = nx();

    const nights = () => Math.round((new Date($('out').value) - new Date($('in').value)) / 864e5);

    fetch('public.php?a=info')
      .then(r => r.json())
      .then(j => {
        types = j.types || {};
        if (j.name) $('hn').textContent = j.name;
        if (j.pay && j.pay.on) {
          payOn = true;
          dep = j.pay.deposit;
          $('go').textContent = 'Continue to secure payment';
          $('el').firstChild.textContent = 'Email (for your receipt)';
        }
        check();
      })
      .catch(() => {
        check();
      });

    async function check() {
      $('m').textContent = '';
      if (nights() < 1) return;
      try {
        const r = await fetch('public.php?a=avail&in=' + $('in').value + '&out=' + $('out').value);
        const j = await r.json();
        if (!r.ok) {
          $('m').textContent = j.error;
          return;
        }
        free = j.free || {};
        if (!free[sel]) sel = '';
        draw();
      } catch (err) {
        // Fallback for standalone view
        draw();
      }
    }

    function draw() {
      const n = nights();
      $('ty').innerHTML = Object.entries(types).map(([k, v]) => {
        const f = free[k] || 0;
        return `<div class="t ${f ? (k === sel ? 'on' : '') : 'off'}" data-k="${k.replace(/"/g, '')}">
          <span><b>${k.replace(/</g, '')}</b><br><small>${f ? f + ' available' : 'Not available'}</small></span>
          <span style="text-align:right">${fm(v)} / night<br><small>${n} night${n > 1 ? 's' : ''}: ${fm(v * n)}</small></span>
        </div>`;
      }).join('') || '<p><small>Loading room options…</small></p>';

      document.querySelectorAll('.t:not(.off)').forEach(e => e.onclick = () => {
        sel = e.dataset.k;
        draw();
      });
      pay();
    }

    function pay() {
      const e = $('pn');
      if (!payOn || !sel || !types[sel]) {
        e.innerHTML = '';
        return;
      }
      e.innerHTML = '<b>Pay now: ' + fm(types[sel] * nights() * 1.1 * dep / 100) + '</b> <small>(' + dep + '% of the total including the 10% service charge)</small>';
    }

    $('in').onchange = () => {
      if ($('out').value <= $('in').value) $('out').value = nx();
      $('out').min = nx();
      check();
    };
    $('out').onchange = check;

    $('go').onclick = async () => {
      const m = $('m');
      m.textContent = '';
      if (!sel) return m.textContent = 'Please choose a room type.';
      if (payOn && !/^\S+@\S+\.\S+$/.test($('e').value)) return m.textContent = 'Please enter your email for the payment receipt.';

      const idVal = $('id_no') ? $('id_no').value.trim() : '';
      let combinedNote = $('n').value.trim();
      if (idVal) {
        combinedNote = combinedNote ? `${combinedNote} | ID: ${idVal}` : `ID: ${idVal}`;
      }

      const b = {
        guest: $('g').value,
        id_number: idVal,
        phone: $('p').value,
        email: $('e').value,
        note: combinedNote,
        adults: +$('a').value,
        room_type: sel,
        in: $('in').value,
        out: $('out').value,
        website: $('w').value
      };

      $('go').disabled = true;
      const r = await fetch('public.php?a=request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(b)
      }).catch(() => null);
      $('go').disabled = false;

      if (!r) return m.textContent = 'Cannot reach the server. Please try again.';
      const j = await r.json();
      if (!r.ok) {
        m.textContent = j.error || 'Server error occurred.';
        check();
        return;
      }

      if (j.pay) {
        const f = document.createElement('form');
        f.method = 'POST';
        f.action = j.pay.action;
        Object.entries(j.pay.fields).forEach(([a, v]) => {
          const i = document.createElement('input');
          i.type = 'hidden';
          i.name = a;
          i.value = v;
          f.appendChild(i);
        });
        document.body.appendChild(f);
        f.submit();
        return;
      }

      $('v').innerHTML = `<div class="c" style="text-align:center">
        <h2 style="color:var(--ac)">Thank you!</h2>
        <p>Your request <b>${j.code}</b> has been received. The hotel will confirm your booking by phone or WhatsApp.</p>
        <p><small>Need help? Call 0817008000.</small></p>
      </div>`;
    };

    const Q = new URLSearchParams(location.search);
    if (Q.get('cancel')) $('m').textContent = 'The payment was cancelled. Your room stays held for 30 minutes, so you can send the request again.';
    if (Q.get('paid')) {
      const code = (Q.get('code') || '').replace(/[^A-Za-z0-9-]/g, '');
      $('v').innerHTML = `<div class="c" style="text-align:center">
        <h2 style="color:var(--ac)">Thank you!</h2>
        <p id="ps">Confirming your payment for <b>${code}</b>…</p>
        <p><small>Need help? Call 0817008000.</small></p>
      </div>`;
      let n = 0;
      const t = setInterval(async () => {
        n++;
        const j = await fetch('public.php?a=status&code=' + code).then(r => r.json()).catch(() => ({}));
        if (j.pay === 'paid') {
          $('ps').innerHTML = 'Payment received for <b>' + code + '</b>. The hotel will confirm your room by phone or WhatsApp.';
          clearInterval(t);
        } else if (n > 10) {
          $('ps').textContent = 'We have not received the payment confirmation yet. If money was deducted, the hotel will confirm your booking shortly.';
          clearInterval(t);
        }
      }, 3000);
    }
  </script>
</body>
</html>
